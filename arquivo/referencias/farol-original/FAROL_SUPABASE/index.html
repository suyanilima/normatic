<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   FAROL | Gestão de Projetos
  </title>
  <style>
   
:root {
    --bg:#f6f8f7;
    --dark:#132b24;
    --green:#167052;
    --text:#1c302a;
    --muted:#73827b;
    --line:#e3e9e5;
    --white:#fff
}
* {
    box-sizing:border-box
}
body {
    margin:0;
    font:14px Inter,system-ui,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text)
}
button,input,select,textarea {
    font:inherit
}
button {
    cursor:pointer
}
aside {
    position:fixed;
    inset:0 auto 0 0;
    width:230px;
    background:var(--dark);
    color:white;
    padding:28px 15px
}
aside h1 {
    margin:0 13px;
    font-size:27px;
    letter-spacing:1px
}
aside p {
    margin:3px 13px 36px;
    color:#9fc0b0;
    font-size:12px
}
nav button {
    display:block;
    width:100%;
    border:0;
    background:none;
    text-align:left;
    color:#c6d7cf;
    padding:13px 15px;
    border-radius:10px;
    margin:3px 0
}
nav button:hover,nav button.active {
    background:#2c4c40;
    color:#fff
}
main {
    margin-left:230px;
    padding:34px;
    max-width:1600px
}
.top {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:24px
}
.top h2 {
    font-size:29px;
    letter-spacing:-.8px;
    margin:0
}
.sub {
    font-size:13px;
    color:var(--muted);
    margin:5px 0
}
.primary {
    background:var(--green);
    color:#fff;
    border:0;
    padding:11px 16px;
    border-radius:10px;
    font-weight:650
}
.secondary {
    background:#edf2ee;
    border:0;
    padding:9px 12px;
    border-radius:9px;
    color:#27453a
}
.danger {
    color:#b52d3d
}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px
}
.card {
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 3px 18px #0e2b2005
}
.metric {
    font-size:32px;
    font-weight:750;
    margin-top:8px
}
.muted {
    color:var(--muted);
    font-size:12px
}
.item {
    border:1px solid var(--line);
    border-radius:11px;
    padding:14px;
    margin:10px 0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px
}
.item h3 {
    margin:0 0 8px;
    font-size:15px
}
.item p {
    margin:5px 0
}
.actions,.toolbar {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center
}
.toolbar {
    margin-bottom:16px
}
.toolbar select,.toolbar input {
    width:auto;
    max-width:230px
}
.tag {
    display:inline-block;
    padding:4px 9px;
    border-radius:30px;
    font-size:11px;
    font-weight:650;
    margin:3px 4px 3px 0;
    background:#edf2ef;
    color:#405b4d
}
.tag.red {
    background:#fce7e7;
    color:#9f2838
}
.tag.orange {
    background:#fff0d9;
    color:#955a10
}
.tag.green {
    background:#dff4e8;
    color:#196746
}
.tag.blue {
    background:#e2efff;
    color:#275a91
}
.tag.purple {
    background:#f0e7fa;
    color:#744a9a
}
.tag.gray {
    background:#eef0f2;
    color:#56616b
}
.progress {
    height:7px;
    background:#e8eeea;
    border-radius:12px;
    overflow:hidden;
    margin-top:10px
}
.progress span {
    display:block;
    background:var(--green);
    height:100%
}
.board {
    display:grid;
    grid-template-columns:repeat(3,minmax(210px,1fr));
    gap:12px
}
.lane {
    background:#edf2ee;
    border-radius:13px;
    padding:12px;
    min-height:150px
}
.lane h4 {
    margin:2px 4px 12px
}
.task-card {
    background:white;
    border:1px solid #e2e9e3;
    border-radius:11px;
    padding:13px;
    margin-bottom:10px
}
.task-card h4 {
    margin:0 0 8px;
    font-size:14px
}
.task-card p {
    margin:5px 0
}
.task-card .actions {
    margin-top:10px
}
.task-card button {
    font-size:12px
}
.task-head {
    display:flex;
    gap:10px;
    align-items:flex-start
}
.task-main {
    flex:1;
    min-width:0
}
.complete-toggle {
    flex:0 0 30px;
    width:30px;
    height:30px;
    border:2px solid #9fb2a8;
    border-radius:50%;
    background:#fff;
    color:#617c6c;
    font-size:23px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0
}
.complete-toggle:hover {
    border-color:#167052;
    color:#167052
}
.complete-toggle.checked {
    background:#167052;
    border-color:#167052;
    color:#fff;
    font-size:18px
}
.is-done h4 {
    text-decoration:line-through;
    color:#7d8a83
}
.complete-action {
    font-weight:700
}
.color-legend {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:5px;
    margin:12px 0 18px
}
.color-legend strong {
    font-size:12px;
    margin-right:5px
}
.calendar {
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:5px
}
.day {
    background:#fff;
    border:1px solid var(--line);
    min-height:95px;
    border-radius:8px;
    padding:7px
}
.weekday {
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:8px
}
.event {
    font-size:11px;
    background:#e4f3e9;
    color:#285e42;
    padding:5px;
    border-radius:5px;
    margin-top:4px;
    cursor:pointer;
    overflow-wrap:anywhere
}
input,select,textarea {
    border:1px solid #d7e0da;
    background:#fff;
    border-radius:9px;
    padding:10px;
    color:var(--text);
    width:100%
}
label {
    display:block;
    font-size:12px;
    font-weight:650;
    margin:9px 0 5px
}
dialog {
    width:min(620px,calc(100% - 24px));
    border:0;
    border-radius:16px;
    padding:24px;
    box-shadow:0 30px 90px #102c2355
}
dialog::backdrop {
    background:#102a2288
}
.fields {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px 15px
}
.wide {
    grid-column:1/-1
}
.modal-actions {
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px
}
#notice {
    position:fixed;
    bottom:20px;
    right:20px;
    max-width:430px;
    background:#142e26;
    color:#fff;
    padding:14px 18px;
    border-radius:10px;
    display:none;
    z-index:30
}
#busy {
    display:none;
    color:var(--muted)
}
@media(max-width:850px) {
    aside {
        position:static;
        width:100%;
        padding:15px
    }
    aside h1 {
        font-size:20px
    }
    aside p {
        margin-bottom:10px
    }
    nav {
        display:flex;
        overflow:auto
    }
    nav button {
        white-space:nowrap;
        width:auto
    }
    main {
        margin:0;
        padding:17px
    }
    .board {
        grid-template-columns:1fr
    }
    .fields {
        grid-template-columns:1fr
    }
    .top h2 {
        font-size:23px
    }
    .calendar {
        overflow-x:auto
    }
    .day {
        min-width:48px;
        min-height:80px
    }
}
@media(max-width:800px) {
    aside {
        position:static;
        width:100%;
        padding:15px
    }
    aside p {
        margin:0 13px 10px
    }
    nav {
        display:flex;
        overflow-x:auto;
        gap:4px
    }
    nav button {
        white-space:nowrap;
        width:auto
    }
    main {
        margin-left:0;
        padding:18px
    }
    .board {
        grid-template-columns:1fr
    }
    .fields {
        grid-template-columns:1fr
    }
    .calendar {
        gap:2px
    }
    .day {
        min-height:75px;
        padding:4px
    }
    .top {
        align-items:flex-start;
        flex-wrap:wrap
    }
}
.simple-list {
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden
}
.simple-task {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:#fff
}
.simple-task:last-child {
    border-bottom:0
}
.simple-task-info {
    min-width:0;
    flex:1
}
.task-meta {
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    color:var(--muted);
    font-size:12px;
    margin-top:5px
}
.person-section {
    margin:12px 0
}
.event.priority-low {
    background:#dff4e8;
    color:#196746;
    border-left:3px solid #268b5b
}
.event.priority-medium {
    background:#e2efff;
    color:#275a91;
    border-left:3px solid #448ed0
}
.event.priority-high {
    background:#fff0d9;
    color:#955a10;
    border-left:3px solid #e7a43b
}
.event.priority-urgent {
    background:#fce7e7;
    color:#9f2838;
    border-left:3px solid #d84b55
}
@media(max-width:850px) {
    .simple-task {
        align-items:flex-start;
        flex-direction:column
    }
    .simple-task .actions {
        width:100%
    }
}
/* FAROL: ajustes para dispositivos móveis, sem alterações no backend */
html {
    min-width:0;
    -webkit-text-size-adjust:100%
}
body {
    min-width:0;
    overflow-x:hidden
}
button {
    touch-action:manipulation
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
    outline:3px solid #7fcbb0;
    outline-offset:2px
}
.card,.item,.simple-list,.simple-task,.task-card,.top,.grid>*,main {
    min-width:0
}
.item h3,.task-card h4,.simple-task-info,.event {
    overflow-wrap:anywhere
}
@media(max-width:850px) {
    aside {
        position:sticky;
        top:0;
        z-index:15;
        width:100%;
        padding:10px 12px 8px;
        background:var(--dark);
        box-shadow:0 3px 12px #10271d1c
    }
    aside h1 {
        margin:0;
        font-size:20px;
        line-height:1.2
    }
    aside p {
        margin:2px 0 8px;
        font-size:11px
    }
    nav {
        display:flex;
        gap:5px;
        overflow-x:auto;
        overscroll-behavior-x:contain;
        scrollbar-width:none;
        padding-bottom:3px;
        -webkit-overflow-scrolling:touch
    }
    nav::-webkit-scrollbar {
        display:none
    }
    nav button {
        flex:0 0 auto;
        width:auto;
        white-space:nowrap;
        margin:0;
        padding:11px 13px;
        min-height:42px;
        font-size:13px
    }
    main {
        margin:0;
        padding:16px 12px max(24px,env(safe-area-inset-bottom));
        width:100%;
        max-width:none
    }
    .top {
        gap:10px;
        margin-bottom:15px;
        align-items:flex-start;
        flex-wrap:wrap
    }
    .top h2 {
        font-size:23px;
        line-height:1.2
    }
    .top .actions {
        width:100%;
        display:grid;
        grid-template-columns:minmax(0,1fr) auto;
        gap:8px
    }
    .top .actions button {
        min-height:44px;
        white-space:normal
    }
    .grid {
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:9px
    }
    .card {
        padding:14px;
        border-radius:13px;
        margin-bottom:12px
    }
    .metric {
        font-size:27px
    }
    .item,.simple-task {
        padding:12px;
        gap:10px
    }
    .item {
        flex-direction:column;
        align-items:stretch
    }
    .item>.actions,.simple-task>.actions {
        width:100%;
        justify-content:flex-start
    }
    .actions button,.toolbar button {
        min-height:40px
    }
    .simple-task {
        flex-direction:column;
        align-items:stretch
    }
    .simple-task .actions {
        display:flex;
        gap:6px
    }
    .simple-task .actions button {
        flex:1 1 auto
    }
    .toolbar {
        align-items:stretch;
        gap:8px
    }
    .toolbar select,.toolbar input {
        max-width:none;
        width:100%;
        min-width:0;
        flex:1 1 140px;
        min-height:44px
    }
    .board {
        grid-template-columns:1fr
    }
    .fields {
        grid-template-columns:minmax(0,1fr);
        gap:4px
    }
    .wide {
        grid-column:auto
    }
    dialog {
        width:calc(100% - 20px);
        max-width:620px;
        max-height:calc(100dvh - 24px);
        overflow-y:auto;
        overscroll-behavior:contain;
        padding:18px 15px;
        border-radius:14px
    }
    dialog h3 {
        margin:0 0 12px;
        font-size:19px
    }
    dialog input,dialog select,dialog textarea {
        min-height:44px;
        font-size:16px
    }
    .modal-actions {
        position:sticky;
        bottom:-18px;
        background:#fff;
        padding:12px 0 max(4px,env(safe-area-inset-bottom));
        margin-top:12px;
        z-index:1
    }
    .modal-actions button {
        min-height:44px;
        flex:1
    }
    #notice {
        left:12px;
        right:12px;
        bottom:calc(12px + env(safe-area-inset-bottom));
        max-width:none
    }
    .calendar {
        grid-template-columns:repeat(7,minmax(0,1fr));
        gap:3px;
        overflow:visible
    }
    .weekday {
        padding:7px 0;
        font-size:10px
    }
    .day {
        min-width:0;
        min-height:75px;
        padding:4px 2px;
        border-radius:6px
    }
    .event {
        font-size:10px;
        padding:3px 2px;
        line-height:1.25
    }
    .task-meta {
        gap:5px
    }
}
@media(max-width:420px) {
    main {
        padding:12px 9px 24px
    }
    .top .actions {
        grid-template-columns:1fr 1fr
    }
    .top .actions button {
        font-size:12px;
        padding:10px 7px
    }
    .grid {
        gap:7px
    }
    .grid .card {
        padding:12px
    }
    .metric {
        font-size:24px
    }
    .card {
        padding:12px
    }
    .tag {
        font-size:10px;
        padding:4px 7px
    }
    .day {
        min-height:65px
    }
    .event {
        font-size:9px
    }
}
@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        scroll-behavior:auto!important;
        animation-duration:.01ms!important;
        transition-duration:.01ms!important
    }
}
/* FAROL: interface inspirada no Lovable, totalmente responsiva */
:root {
    --bg:#f8faf9;
    --dark:#166044;
    --green:#176348;
    --text:#22342d;
    --muted:#82908a;
    --line:#e2e9e5;
    --white:#fff
}
body {
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#f8faf9;
    font-size:13px
}
aside {
    background:#fff;
    color:#283d34;
    border-right:1px solid #e4ebe6;
    width:224px;
    padding:30px 16px 16px;
    display:flex;
    flex-direction:column;
    z-index:20
}
.brand {
    display:flex;
    align-items:center;
    gap:10px;
    padding:2px 8px 0
}

    height:39px;
    width:39px;
    background:#176348;
    border-radius:8px;
    color:white;
    display:grid;
    place-items:center;
    font-size:25px
}
.brand h1 {
    font-size:25px;
    color:#176348;
    margin:0;
    letter-spacing:-1px;
    line-height:1.1
}
.brand p {
    font-size:8px;
    letter-spacing:.7px;
    color:#7a8880;
    margin:5px 0 0;
    font-weight:750
}
.nav-caption {
    font-size:10px;
    color:#85928c;
    font-weight:750;
    margin:50px 12px 14px;
    letter-spacing:.4px
}
nav button {
    color:#65756d;
    padding:13px 12px;
    font-weight:550;
    border-radius:6px;
    font-size:13px;
    margin:2px 0
}
nav button:hover {
    background:#f0f6f2;

.item {

.progress {

.app-footer b {
    color:#176348

dialog {
    border:1px solid #e3e9e5;
    border-radius:9px;
    box-shadow:0 22px 75px #0c241d40
}
dialog::backdrop {
    background:#12251d75
}
dialog h3 {

        if(table==='tarefas') {row.status ||= 'A fazer';row.prioridade ||= 'Média';}
        if(table==='projetos') {row.status ||= 'Ativo';row.prioridade ||= 'Média';}

    function viewCalendarRecord(n, id) { ocultarAcoesCompromisso(); const r = DATA[n]?.find(x => x.id === id); if (!r)
        return notify('Registro não encontrado'); if (n === 'tarefas')
        return viewTask(id); const fields = n === 'projetos' ? [['Descrição', r.objetivo], ['Responsável', r.responsavel], ['Prioridade', r.prioridade], ['Status', r.status], ['Prazo', dt(r.prazo)]] : [['Data', dt(r.data)], ['Horário', r.hora], ['Término', r.hora_fim], ['Responsável', r.responsavel], ['Observações', r.observacoes]]; document.getElementById('detailsTitle').textContent = r.nome || r.titulo || 'Detalhes'; document.getElementById('detailsBody').innerHTML = fields.map(([k, v]) => `<p><b>${k}:</b> ${esc(v || 'Não informado')}</p>`).join(''); if (n === 'agenda') configurarAcoesCompromisso(id); document.getElementById('details').showModal(); }
    function calendar() { const first = new Date(year, month, 1), last = new Date(year, month + 1, 0).getDate(); let cells = ''; for (let i = 0; i < first.getDay(); i++)
        cells += '<div class="calendar-pad" aria-hidden="true"></div>'; for (let d = 1; d <= last; d++) {
        const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, events = calendarEvents(date);
        cells += `<div class="day ${selectedCalendarDay === date ? 'calendar-selected' : ''}"><button type="button" class="calendar-day-number" onclick="selectCalendarDay('${date}')" aria-label="Visualizar dia ${d}">${d}</button>${events.slice(0, 3).map(e => `<button type="button" class="event ${calendarPriority(e)}" onclick="viewCalendarRecord('${e.n}','${e.id}')" title="Visualizar ${esc(e.title)}">${esc(e.at)} · ${esc(e.title)}</button>`).join('')}${events.length > 3 ? `<button type="button" class="calendar-more" onclick="selectCalendarDay('${date}')">+ ${events.length - 3} mais · Ver dia</button>` : ''}</div>`;
    } const selected = selectedCalendarDay && selectedCalendarDay.startsWith(`${year}-${String(month + 1).padStart(2, '0')}-`) ? selectedCalendarDay : null; const dayEvents = selected ? calendarEvents(selected) : []; return `<section class="card"><div class="toolbar"><button class="secondary" onclick="changeMonth(-1)">←</button><b>${first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</b><button class="secondary" onclick="changeMonth(1)">→</button></div><div class="calendar-shell"><div class="calendar-main"><div class="calendar">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(x => `<div class="weekday">${x}</div>`).join('')}${cells}</div></div><aside class="calendar-side"><h3>${selected ? `Dia ${dt(selected)}` : 'Selecione um dia'}</h3><p class="muted">${selected ? `${dayEvents.length} registro(s) neste dia` : 'Clique no número de um dia para visualizar todas as atividades.'}</p><div class="calendar-day-list">${dayEvents.length ? dayEvents.map(e => `<div class="calendar-entry-actions"><button type="button" class="calendar-day-entry" onclick="viewCalendarRecord('${e.n}','${e.id}')"><strong>${esc(e.title)}</strong><span>${esc(e.at)} · ${esc(e.prio)}</span></button></div>`).join('') : selected ? '<p class="muted">Nenhuma atividade neste dia.</p>' : ''}</div></aside></div></section>`; }
    function changeMonth(n) { month += n; if (month < 0) {
        month = 11;
        year--;
    } if (month > 11) {
        month = 0;
        year++;
    } render(); }
    function newRecord(n, defaults = {}) { openEditor(n || page, { prioridade: 'Média', ...(n === 'tarefas' || page === 'tarefas' ? { status: 'A fazer' } : {}), ...defaults }); }
    function edit(n, id) { const item = DATA[n].find(x => x.id === id); if (!item)
        return notify('Registro não encontrado'); openEditor(n, item); }
    // Monta datas independentes para uma reunião com horários diferentes.
    function atualizarModoAgenda() {
        const varias = document.querySelector('input[name="modo_agenda"]:checked')?.value === 'varias';
        const grupo = document.getElementById('agendaDatasMultiplas');
        if (!grupo) return;
        grupo.hidden = !varias;
        for (const nome of ['data', 'hora', 'hora_fim']) {
            const campo = document.querySelector(`#fields [name="${nome}"]`);
            if (campo) {
                campo.closest('div').hidden = varias;
                campo.required = !varias && nome !== 'hora_fim';
            }
        }
    }
    function adicionarDataAgenda(data = '', inicio = '09:00', fim = '10:00') {
        const lista = document.getElementById('agendaListaDatas');
        if (!lista) return;
        const linha = document.createElement('div');
        linha.className = 'agenda-data-linha';
        linha.innerHTML = `<div><label>Data</label><input type="date" class="agenda-data" required></div>
            <div><label>Início</label><input type="time" class="agenda-inicio" required></div>
            <div><label>Término</label><input type="time" class="agenda-fim" required></div>
            <button type="button" class="secondary" onclick="this.closest('.agenda-data-linha').remove()">Remover</button>`;
        linha.querySelector('.agenda-data').value = data;
        linha.querySelector('.agenda-inicio').value = inicio;
        linha.querySelector('.agenda-fim').value = fim;
        lista.appendChild(linha);
    }
    function prepararMultiplasDatasAgenda() {
        const fields = document.getElementById('fields');
        fields.insertAdjacentHTML('beforeend', `<div class="agenda-modo">
            <strong>Agendamento</strong><div class="agenda-modo-opcoes">
            <label><input type="radio" name="modo_agenda" value="unica" checked onchange="atualizarModoAgenda()"> Uma data</label>
            <label><input type="radio" name="modo_agenda" value="varias" onchange="atualizarModoAgenda()"> Várias datas</label>
            </div></div><div id="agendaDatasMultiplas" class="agenda-datas" hidden>
            <strong>Datas e horários personalizados</strong><div id="agendaListaDatas"></div>
            <button type="button" class="secondary" onclick="adicionarDataAgenda()">+ Adicionar outra data</button></div>`);
        const data = fields.querySelector('[name="data"]')?.value || '';
        const inicio = fields.querySelector('[name="hora"]')?.value || '09:00';
        const fim = fields.querySelector('[name="hora_fim"]')?.value || '10:00';
        adicionarDataAgenda(data, inicio, fim);
        adicionarDataAgenda('', inicio, fim);
    }
    function openEditor(n, r) { editTable = n; editing = r.id || null; const cfg = CONFIG[n]; if (!cfg)
        return notify('Módulo inválido'); document.getElementById('modalTitle').textContent = (editing ? 'Editar ' : 'Novo ') + cfg.label; document.getElementById('fields').innerHTML = cfg.fields.map(([key, title, type, opts]) => { const v = r[key] ?? '', sel = (choices) => `<select name="${key}"><option value="">Selecione</option>${choices.map(([id, name]) => `<option value="${esc(id)}" ${String(v) === String(id) ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select>`; let field; if (type === 'textarea')
        field = `<textarea name="${key}" rows="3">${esc(v)}</textarea>`;
    else if (type === 'select')
        field = sel(opts.map(x => [x, x]));
    else if (type === 'colors')
        field = sel(COLORS);
    else if (type === 'project')
        field = sel(DATA.projetos.map(p => [p.id, p.nome]));
    else if (type === 'person')
        field = sel(DATA.responsaveis.filter(p => p.ativo !== 'Não').map(p => [p.nome, p.nome]));
    else
        field = `<input name="${key}" type="${type}" value="${esc(v)}" ${opts === 1 ? 'required' : ''}>`; return `<div class="${type === 'textarea' ? 'wide' : ''}"><label>${title}</label>${field}</div>`; }).join(''); if (n === 'agenda' && !editing) prepararMultiplasDatasAgenda(); document.getElementById('modal').showModal(); }
    // Atualiza a interface antes da confirmação do servidor.
    document.getElementById('editor').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = e.target.querySelector('[type=submit]');
      if (button.disabled) return;
      button.disabled = true;

      const table = editTable;
      const original = editing ? DATA[table].find(x => x.id === editing) : null;
      const previous = original ? { ...original } : null;
      const form = Object.fromEntries(new FormData(e.target).entries());
      const variasDatas = table === 'agenda' && !editing && form.modo_agenda === 'varias';
      delete form.modo_agenda;
      if (editing) form.id = editing;

      if (variasDatas) {
        const linhas = [...document.querySelectorAll('#agendaListaDatas .agenda-data-linha')];
        const datas = linhas.map(linha => ({
          data: linha.querySelector('.agenda-data').value,
          hora: linha.querySelector('.agenda-inicio').value,
          hora_fim: linha.querySelector('.agenda-fim').value
        }));
        const chaves = datas.map(d => d.data + '|' + d.hora);
        if (!datas.length || datas.some(d => !d.data || !d.hora || !d.hora_fim || d.hora_fim <= d.hora)
            || new Set(chaves).size !== chaves.length) {
          button.disabled = false;
          return notify('Preencha as datas e os horários corretamente, sem datas e inícios duplicados.');
        }
        // Exibe imediatamente os compromissos, sem esperar cada gravação.
        const temporarios = datas.map((data, i) => ({
          ...form, ...data,
          id: `temporario-lote-${Date.now()}-${i}`
        }));
        DATA.agenda.push(...temporarios);
        document.getElementById('modal').close();
        render();
        notify(`Salvando ${datas.length} compromisso(s)...`);

        try {
          // Uma chamada ao Apps Script para todas as datas.
          const resultado = await api('saveAgendaEmLote', form, datas);
          const ids = new Set(temporarios.map(item => item.id));
          DATA.agenda = DATA.agenda.filter(item => !ids.has(item.id));
          DATA.agenda.push(...resultado.records);
          render();
          const avisos = resultado.avisos || [];
          notify(`${resultado.records.length} compromisso(s) salvo(s).` +
            (avisos.length ? ' Avisos do Google Agenda: ' + avisos.join('; ') : ''));
        } catch (erro) {
          const ids = new Set(temporarios.map(item => item.id));
          DATA.agenda = DATA.agenda.filter(item => !ids.has(item.id));
          // Se houve falha após a gravação, recarrega os dados para evitar duplicações.
          try {
            DATA = await api('getData');
          } catch (_) {
            // Mantém a interface utilizável mesmo se a atualização falhar.
          }
          render();
          notify('Não foi possível confirmar o lote. Confira a agenda antes de tentar novamente: ' +
            (erro.message || erro));
        } finally {
          button.disabled = false;
        }
        return;
      }

      const temporaryId = editing || `temporario-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const optimistic = { ...(original || {}), ...form, id: temporaryId };
      const index = DATA[table].findIndex(x => x.id === temporaryId);

      if (index >= 0) DATA[table][index] = optimistic;
      else DATA[table].push(optimistic);

      document.getElementById('modal').close();
      render();

      try {
        const result = await api('saveRecord', table, form);
        const position = DATA[table].findIndex(x => x.id === temporaryId);
        if (position >= 0) DATA[table][position] = result.record;
        else DATA[table].push(result.record);
        render();

        const c = result.calendar;
        notify(c?.status === 'erro'
          ? 'Registro salvo, mas o Google Agenda falhou: ' + c.message
          : c?.status === 'criado'
            ? 'Registro salvo; convite solicitado ao Google Agenda'
            : c?.status === 'atualizado'
              ? 'Registro salvo e evento atualizado no Google Agenda'
              : c?.status === 'removido'
                ? 'Registro salvo e evento removido do Google Agenda'
                : 'Registro salvo');
      } catch (err) {
        const position = DATA[table].findIndex(x => x.id === temporaryId);
        if (previous) {
          if (position >= 0) DATA[table][position] = previous;
          else DATA[table].push(previous);
        } else if (position >= 0) {
          DATA[table].splice(position, 1);
        }
        render();
        notify('Erro ao salvar; alteração desfeita: ' + (err.message || err));
      } finally {
        button.disabled = false;
      }
    });

    const savingStatus = new Set();
    async function changeStatus(id, status) { if (savingStatus.has(id))
        return; const t = DATA.tarefas.find(x => x.id === id); if (!t)
        return; const old = t.status; savingStatus.add(id); t.status = status; render(); if (document.getElementById('details').open)
        document.getElementById('details').close(); try {
        const result = await api('setTaskStatus', id, status);
        notify(result.calendar?.status === 'erro' ? 'Status salvo, mas Google Agenda falhou: ' + result.calendar.message : status === 'Concluída' ? 'Tarefa concluída' : 'Status atualizado');
    }
    catch (e) {
        t.status = old;
        render();
        notify('Erro ao salvar; alteração desfeita: ' + (e.message || e));
    }
    finally {
        savingStatus.delete(id);
    } }
    const deletingRecords = new Set();

    async function removeRecord(n, id) {
      if (deletingRecords.has(`${n}:${id}`)) return;
      if (!confirm('Excluir este registro?')) return;

      const index = DATA[n].findIndex(x => x.id === id);
      if (index < 0) return;

      const removed = DATA[n][index];
      const key = `${n}:${id}`;
      deletingRecords.add(key);
      DATA[n].splice(index, 1);
      render();

      try {
        await api('deleteRecord', n, id);
        notify('Registro excluído');
      } catch (e) {
        DATA[n].splice(Math.min(index, DATA[n].length), 0, removed);
        render();
        notify('Erro ao excluir; registro restaurado: ' + (e.message || e));
      } finally {
        deletingRecords.delete(key);
      }
    }

    async function syncAll() { try {
        notify('Sincronizando com o Google Agenda...');
        const r = await api('syncCalendar');
        notify(`Google Agenda: ${r.criados} criados, ${r.atualizados} atualizados, ${r.removidos} removidos, ${r.ignorados} ignorados, ${r.fail.length} erros.${r.fail.length ? ' ' + r.fail.slice(0, 2).join('; ') : ''}`);
    }
    catch (e) {
        notify('Erro na sincronização: ' + (e.message || e));
    } }
    requireAuth().then(()=>{setupRealtime();return refresh();}).catch(e=>notify(e.message||String(e)));
  </script>
